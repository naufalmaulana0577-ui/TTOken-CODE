[package]
name = "ttoken-code-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
description = "TTOken Code Desktop shell on Tauri 2"

[lib]
name = "ttoken_code_desktop"
path = "src/lib.rs"

[[bin]]
name = "ttoken-code-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "process", "sync", "time", "macros"] }
reqwest = { version = "0.13", default-features = false }
httparse = "1.10"
base64 = "0.22"
getrandom = "0.3"
url = "2.5"
percent-encoding = "2.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
