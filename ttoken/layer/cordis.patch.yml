# Lapisan distribusi TTOken Code.
#
# Diterapkan paling akhir oleh Host desktop, di atas bundle base dan web-app.
# Formatnya sama dengan overlay `--patch` upstream: baris ber-`id` mengganti
# seluruh `config` baris yang dituju, jadi setiap baris di bawah menulis ulang
# semua field yang ia miliki.
#
# Sumber kebenaran ada di file ini. `ttoken/apply-brand.mjs` menanamkannya ke
# `apps/desktop-host/src/ttoken-layer.ts`; jangan edit file hasil itu.

# Model bawaan untuk Agent baru: rute Gateway, bukan rute resmi DeepSeek.
- id: agent-default-model
  config:
    provider: ttoken
    model: deepseek/deepseek-v4.1-flash

# TTOken Gateway sebagai rute OpenAI-compatible. Key tidak ditulis di sini:
# `apiKeyEnv` adalah referensi kredensial yang diisi user lewat halaman Models.
# Daftar model mengikuti lineup Gateway (FENRIR_MODEL_SLUGS di repo TTOken).
- id: llm-pi-ai
  config:
    providers:
      ttoken:
        displayName: TTOken Gateway
        apiKeyEnv: TTOKEN_API_KEY
        api: openai-completions
        baseURL: https://api.ttoken.dev/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 128000
          - id: z-ai/glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 1000000
            maxTokens: 128000
          - id: qwen/qwen3.8-27b
            name: Qwen 3.8 27B
            contextWindow: 256000
            maxTokens: 64000

# Analitik produk upstream menyala secara bawaan di profil desktop dan
# mengirim ke kolektor DeepSeek. Distribusi ini mematikan analitik dan
# exporter-nya. Pemanggil analitik di klien semuanya opsional.
- id: product-analytics
  disabled: true
- id: desktop-product-telemetry
  disabled: true

# Unggahan log sesi saat user memberi feedback juga menuju kolektor DeepSeek.
# Ini setara dengan saklar DSH_TELEMETRY_DISABLED milik upstream.
- id: session-telemetry-otel
  disabled: true

# Plugin yang terikat ke layanan DeepSeek: akun dan login, provider resmi,
# pencarian web lewat API DeepSeek, unggahan log sesi untuk melatih model
# DeepSeek, impor riwayat chat DeepSeek, terjemahan lewat DeepSeek Flash,
# berbagi sesi lewat server DeepSeek, dan pasar plugin DeepSeek.
- id: deepseek-account
  disabled: true
- id: deepseek-auth
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: llm-deepseek
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-deepseek-api
  disabled: true
- id: deepseek-chat-import
  disabled: true
- id: translator
  disabled: true
- id: cot-translation
  disabled: true
- id: liveshare-share-host
  disabled: true
- id: ui-plugin-market
  disabled: true
- id: cli-account
  disabled: true

# Halaman antarmuka untuk layanan di atas, yang kosong atau menyesatkan tanpa
# layanannya: akun, unggahan log sesi, pencarian web, dan umpan balik pesan
# yang dikirim ke DeepSeek.
- id: ui-settings-account
  disabled: true
- id: ui-account-notifications
  disabled: true
- id: ui-settings-session-log
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: message-feedback
  disabled: true
- id: ui-message-feedback
  disabled: true
- id: command-feedback
  disabled: true

# Fitur ekosistem upstream: halaman Plugins menampilkan nama paket upstream,
# rekomendasi plugin, skill lencana "powered by DSH", dan konteks pengembangan
# upstream yang menyebut produknya di prompt model.
- id: ui-plugin-manager
  disabled: true
- id: plugin-recommendations
  disabled: true
- id: client-ui-plugin-recommendations
  disabled: true
- id: creation-recommendations
  disabled: true
- id: client-ui-creation-recommendations
  disabled: true
- id: skill-badge
  disabled: true
- id: harness-dev-context
  disabled: true
