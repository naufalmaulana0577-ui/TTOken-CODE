# Lapisan distribusi TTOken Code.
#
# Diterapkan paling akhir oleh Host desktop, di atas bundle base dan web-app.
# Formatnya sama dengan overlay `--patch` upstream: baris ber-`id` mengganti
# seluruh `config` baris yang dituju, jadi setiap baris di bawah menulis ulang
# semua field yang ia miliki.
#
# Sumber kebenaran ada di file ini. `ttoken/apply-brand.mjs` menanamkannya ke
# `apps/desktop-host/src/ttoken-layer.ts`; jangan edit file hasil itu.

# Model bawaan untuk Agent baru: rute Gateway, bukan rute resmi DeepSeek.
- id: agent-default-model
  config:
    provider: ttoken
    model: deepseek/deepseek-v4.1-flash

# TTOken Gateway sebagai rute OpenAI-compatible. Key tidak ditulis di sini:
# `apiKeyEnv` adalah referensi kredensial yang diisi user lewat halaman Models.
# Daftar model mengikuti lineup Gateway (FENRIR_MODEL_SLUGS di repo TTOken).
- id: llm-pi-ai
  config:
    providers:
      ttoken:
        displayName: TTOken Gateway
        apiKeyEnv: TTOKEN_API_KEY
        api: openai-completions
        baseURL: https://api.ttoken.dev/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 128000
          - id: z-ai/glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 1000000
            maxTokens: 128000
          - id: qwen/qwen3.8-27b
            name: Qwen 3.8 27B
            contextWindow: 256000
            maxTokens: 64000

# Analitik produk upstream menyala secara bawaan di profil desktop dan
# mengirim ke kolektor DeepSeek. Distribusi ini mematikan analitik dan
# exporter-nya. Pemanggil analitik di klien semuanya opsional.
- id: product-analytics
  disabled: true
- id: desktop-product-telemetry
  disabled: true

# Unggahan log sesi saat user memberi feedback juga menuju kolektor DeepSeek.
# Ini setara dengan saklar DSH_TELEMETRY_DISABLED milik upstream.
- id: session-telemetry-otel
  disabled: true

# Plugin yang hanya berguna dengan layanan DeepSeek, atau mengirim data ke
# sana: provider resmi DeepSeek dan pendukungnya, unggahan log sesi untuk
# melatih model DeepSeek, pencarian native DeepSeek, impor riwayat chat dari
# situs DeepSeek, berbagi sesi lewat server terpisah, dan skill lencana DSH.
# Rute model akun DeepSeek juga mati: setelah login akun TTOken, chat memakai
# rute TTOken Gateway di atas dengan key perangkat hasil login.
# Halaman Plugins tidak mendaftar paket ini (HIDDEN_PACKAGES di apply-brand.mjs).
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
- id: deepseek-llm-api-extensions
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: ui-settings-session-log
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: deepseek-chat-import
  disabled: true
- id: liveshare-share-host
  disabled: true
- id: skill-badge
  disabled: true

# Halaman pengaturan pencarian web juga mati: pilihan penyedia dan cara bayar
# di sana khusus layanan DeepSeek, sedangkan pencarian web TTOken Code punya
# satu penyedia dan dibayar dari saldo key Gateway. Pencarian web sendiri ada
# di web.patch.yml.
- id: ui-settings-web-search
  disabled: true

# Layanan akun diarahkan ke rute `/api/v1/code/desktop` di ttoken.dev
# (docs/CODE-DESKTOP.md di repo TTOken). Layanan ini harus tetap menyala:
# layar sambutan membaca status akunnya sebelum membuka jendela utama, dan
# tanpa layanan itu aplikasi gagal saat mulai. Selama belum login, layanan
# ini tidak menghubungi server mana pun. `config` mengganti seluruh config
# baris upstream, jadi `desktopPlatform` disalin apa adanya dari
# packages/bundle/base/cordis.patch.yml. Antarmuka login ada di
# account.patch.yml.
- id: deepseek-account
  config:
    desktopPlatform: !!js "ctx.get('profileContext')?.name === 'desktop' && ['darwin', 'win32'].includes(process.platform) ? process.platform : null"
    platformOrigin: https://ttoken.dev
    harnessOrigin: https://ttoken.dev
    inferenceOrigin: https://api.ttoken.dev
